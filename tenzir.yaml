tenzir:
  pipelines:
    subscribe-pivottrack-results-hosts:
      name: Ingest Common OSINT Model Host Findings
      description: |
        Onboards Common OSINT Model (COM) information, created by Pivottrack and ingest data into node.
      definition: |
        let $mq_user=env("PT_RABBITMQ_USER")
        let $mq_pass=env("PT_RABBITMQ_PASS")
        let $mq_host=env("PT_RABBITMQ_HOST")
        let $mq_port=env("PT_RABBITMQ_PORT")
        load_amqp "amqp://"+$mq_user+":"+$mq_pass+"@"+$mq_host+":"+$mq_port, queue="pivottrack-results-hosts", no_auto_delete=true, durable=true
        read_json
        unroll com_query_results
        host = com_query_results
        drop com_query_results
        @name = "pivottrack.host-events"
        import
      restart-on-error: 1 minute
      labels:
        - PivotTrack
      disabled: false
      unstoppable: true
    publish-hosts:
      name: Export COM data and publish to topic
      description: |
        Exports host events and publishes them to their designated pipelines.
      definition: |
        export live=true
        where @name == "pivottrack.host-events"
        publish "pivottrack.hosts.import"
      restart-on-error: 1 minute
      labels:
        - PivotTrack
      disabled: false
      unstoppable: true
    update-host-context-new:
      name: Enrich with and update Context
      description: |
        Updates the context to identify new hosts.
      definition: |
        subscribe "pivottrack.hosts.import"
        context::enrich "pthostscontext", key=host.ip, into=knownhosts
        set known = true if knownhosts != null else false
        drop knownhosts
        fork {
          context::update "pthostscontext", key=host.ip, value=true
        }
        publish "pivottrack.hosts.enriched"
      restart-on-error: 1 minute
      labels:
        - PivotTrack
      disabled: false
      unstoppable: true
  contexts:
    pthostscontext:
      type: lookup-table